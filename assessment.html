<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMA — Evaluación</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .question-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(13, 26, 62, 0.06);
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.selected {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .range-container {
            padding: 20px 0;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
        }

        .range-marks {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 8px;
        }

        .question-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .required-mark { color: var(--primary-color); }

        .question-help {
            display: block;
            color: var(--slate);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            font: inherit;
        }

        .option-check,
        .ranking-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
        }

        .option-check input { accent-color: var(--primary-color); }

        .ranking-pos {
            width: 64px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            font: inherit;
        }

        .question-info { background: rgba(13, 26, 62, 0.04); }

        .question-card[hidden] { display: none; }
    </style>
</head>

<body>
    <div class="container" style="padding-bottom: 100px;">
        <div class="mb-4 flex-center" style="justify-content: space-between;">
            <button class="btn-icon" onclick="history.back()">←</button>
            <h2>Evaluación</h2>
            <div style="width: 24px;"></div>
        </div>

        <div id="loading" class="text-center">
            <p>Cargando evaluación...</p>
        </div>

        <div id="formContainer" style="display: none;">
            <div id="questionsList"></div>
            <button class="btn btn-primary btn-full mt-4" onclick="submitForm()">Finalizar Evaluación</button>
        </div>
    </div>

    <script src="js/conditions.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        let currentFormId = null;
        let currentSubmissionId = null;
        let answers = {};

        async function loadForm() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const formCode = urlParams.get('code');

                if (!formCode) {
                    alert('Código de formulario no especificado');
                    window.location.href = 'evaluations.html';
                    return;
                }

                const form = await api.getFormSchema(formCode);

                if (!form) {
                    alert('Formulario no encontrado');
                    return;
                }

                // Dibujar primero: si el render falla, no queremos haber dejado
                // una evaluación abierta que nadie va a responder.
                renderForm(form);

                const sub = await api.startSubmission(form.form_id);
                currentSubmissionId = sub.submission_id;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';

            } catch (error) {
                console.error('Error loading form:', error);
                document.getElementById('loading').innerHTML = '<p>Error al cargar el formulario.</p>';
            }
        }

        // --- Traducciones -------------------------------------------------
        // El modelo entero está diseñado sobre claves de traducción y la tabla
        // existe, pero nadie la consultaba: la app pintaba la clave cruda
        // (F24). Mientras el backend no exponga las traducciones resueltas, se
        // usa el diccionario local y se cae al texto de la clave, que hoy suele
        // ser la frase en español.
        function t(clave) {
            if (!clave) return '';
            const lang = localStorage.getItem('alma_lang') || 'es';
            const dicc = (window.translations && window.translations[lang]) || {};
            return dicc[clave] || clave;
        }

        // --- Registro de renderizadores ------------------------------------
        const renderers = {
            'single': renderSingleChoice,
            'multi': renderMultiChoice,
            'dropdown': renderDropdown,
            'scale': renderScale,
            'ranking': renderRanking,
            'date': renderDate,
            'text': renderText,
            'paragraph': renderParagraph,
            'info': renderInfo
        };

        // Preguntas montadas, para poder recalcular qué se muestra sin volver a
        // dibujar: rehacer el DOM en cada respuesta perdería el foco y el
        // scroll mientras la mujer escribe.
        const montadas = [];

        function renderForm(form) {
            const container = document.getElementById('questionsList');
            container.innerHTML = '';
            montadas.length = 0;

            if (!form.sections || form.sections.length === 0) {
                container.innerHTML = '<p>Formulario sin secciones definidas.</p>';
                return;
            }

            form.sections.forEach(section => {
                renderSectionTitle(container, section);
                section.questions.forEach(q => renderQuestion(container, q));
            });

            actualizarVisibilidad();
        }

        function renderSectionTitle(container, section) {
            const title = document.createElement('h3');
            title.textContent = t(section.title_key) || 'Sección';
            title.className = 'mb-4 mt-4';
            container.appendChild(title);
        }

        function renderQuestion(container, q) {
            const card = document.createElement('div');
            card.className = 'question-card';

            const label = document.createElement('label');
            label.className = 'question-label';
            label.textContent = t(q.text_key) || q.variable_name || 'Pregunta';
            if (q.is_required) {
                const marca = document.createElement('span');
                marca.className = 'required-mark';
                marca.textContent = ' *';
                marca.setAttribute('aria-label', 'obligatoria');
                label.appendChild(marca);
            }
            card.appendChild(label);

            if (q.help_text) {
                const ayuda = document.createElement('small');
                ayuda.className = 'question-help';
                ayuda.textContent = q.help_text;
                card.appendChild(ayuda);
            }

            const renderer = renderers[q.type];
            if (renderer) {
                renderer(card, q);
            } else {
                console.warn('Tipo de pregunta no soportado: ' + q.type);
                const aviso = document.createElement('p');
                aviso.className = 'question-help';
                aviso.textContent = 'Esta pregunta no se puede mostrar en esta versión.';
                card.appendChild(aviso);
            }

            container.appendChild(card);
            montadas.push({ card: card, q: q });
        }

        // --- Renderizadores por tipo ---------------------------------------

        function renderSingleChoice(container, q) {
            if (!q.options || q.options.length === 0) {
                container.innerHTML += '<p>No hay opciones definidas.</p>';
                return;
            }

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.textContent = t(opt.label_key) || opt.value;
                btn.dataset.value = opt.value;
                btn.setAttribute('aria-pressed', 'false');

                btn.onclick = () => {
                    container.querySelectorAll('.option-btn').forEach(b => {
                        b.classList.remove('selected');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('selected');
                    btn.setAttribute('aria-pressed', 'true');
                    saveAnswer(q, opt.value);
                };
                container.appendChild(btn);
            });
        }

        function renderMultiChoice(container, q) {
            if (!q.options || q.options.length === 0) {
                container.innerHTML += '<p>No hay opciones definidas.</p>';
                return;
            }

            const elegidas = [];
            q.options.forEach(opt => {
                const fila = document.createElement('label');
                fila.className = 'option-check';

                const box = document.createElement('input');
                box.type = 'checkbox';
                box.value = opt.value;
                box.onchange = () => {
                    const i = elegidas.indexOf(opt.value);
                    if (box.checked && i === -1) elegidas.push(opt.value);
                    if (!box.checked && i !== -1) elegidas.splice(i, 1);
                    saveAnswer(q, elegidas.slice());
                };

                const texto = document.createElement('span');
                texto.textContent = t(opt.label_key) || opt.value;

                fila.appendChild(box);
                fila.appendChild(texto);
                container.appendChild(fila);
            });
        }

        function renderDropdown(container, q) {
            const select = document.createElement('select');
            select.className = 'form-control';

            const vacia = document.createElement('option');
            vacia.value = '';
            vacia.textContent = 'Elegí una opción';
            select.appendChild(vacia);

            (q.options || []).forEach(opt => {
                const o = document.createElement('option');
                o.value = opt.value;
                o.textContent = t(opt.label_key) || opt.value;
                select.appendChild(o);
            });

            select.onchange = () => saveAnswer(q, select.value);
            container.appendChild(select);
        }

        function renderScale(container, q) {
            const min = (q.config && q.config.min) != null ? q.config.min : 0;
            const max = (q.config && q.config.max) != null ? q.config.max : 10;
            const step = (q.config && q.config.step) || 1;

            const caja = document.createElement('div');
            caja.className = 'range-container';

            const input = document.createElement('input');
            input.type = 'range';
            input.min = min;
            input.max = max;
            input.step = step;
            input.value = Math.floor((max + min) / 2);

            const marcas = document.createElement('div');
            marcas.className = 'range-marks';
            const izq = document.createElement('span');
            izq.className = 'text-small';
            izq.textContent = min;
            const actual = document.createElement('strong');
            actual.textContent = input.value;
            const der = document.createElement('span');
            der.className = 'text-small';
            der.textContent = max;
            marcas.appendChild(izq);
            marcas.appendChild(actual);
            marcas.appendChild(der);

            input.oninput = () => { actual.textContent = input.value; };
            input.onchange = () => saveAnswer(q, input.value);

            caja.appendChild(input);
            caja.appendChild(marcas);
            container.appendChild(caja);
        }

        function renderRanking(container, q) {
            // Ordenar por preferencia: cada opción lleva su posición. Se resuelve
            // con selects para que funcione con lector de pantalla y sin gestos
            // de arrastre, que en un teléfono son poco fiables.
            const total = (q.options || []).length;
            const posiciones = {};

            (q.options || []).forEach(opt => {
                const fila = document.createElement('div');
                fila.className = 'ranking-row';

                const select = document.createElement('select');
                select.className = 'ranking-pos';
                select.setAttribute('aria-label', 'Posición de ' + (t(opt.label_key) || opt.value));

                const vacia = document.createElement('option');
                vacia.value = '';
                vacia.textContent = '–';
                select.appendChild(vacia);
                for (let i = 1; i <= total; i++) {
                    const o = document.createElement('option');
                    o.value = String(i);
                    o.textContent = String(i);
                    select.appendChild(o);
                }

                select.onchange = () => {
                    if (select.value) posiciones[opt.value] = parseInt(select.value, 10);
                    else delete posiciones[opt.value];

                    const orden = Object.keys(posiciones)
                        .sort((a, b) => posiciones[a] - posiciones[b]);
                    saveAnswer(q, orden);
                };

                const texto = document.createElement('span');
                texto.textContent = t(opt.label_key) || opt.value;

                fila.appendChild(select);
                fila.appendChild(texto);
                container.appendChild(fila);
            });
        }

        function renderDate(container, q) {
            const input = document.createElement('input');
            input.type = 'date';
            input.className = 'form-control';
            input.onchange = () => saveAnswer(q, input.value);
            container.appendChild(input);
        }

        function renderText(container, q) {
            const input = document.createElement('input');
            input.type = (q.ui_hint === 'numeric_keyboard') ? 'number' : 'text';
            input.className = 'form-control';
            if (q.placeholder) input.placeholder = q.placeholder;
            input.oninput = () => saveAnswer(q, input.value);
            container.appendChild(input);
        }

        function renderParagraph(container, q) {
            const area = document.createElement('textarea');
            area.className = 'form-control';
            area.rows = 4;
            if (q.placeholder) area.placeholder = q.placeholder;
            area.oninput = () => saveAnswer(q, area.value);
            container.appendChild(area);
        }

        function renderInfo(container, q) {
            // Sólo texto informativo: la etiqueta ya se dibujó y no hay nada que
            // responder.
            container.classList.add('question-info');
        }

        // --- Lógica condicional --------------------------------------------

        function contextoCondiciones() {
            // Las condiciones se escriben sobre data_key, igual que las fórmulas
            // de puntuación, para que signifiquen lo mismo de los dos lados.
            const ctx = {};
            montadas.forEach(({ q }) => {
                if (q.data_key && answers[q.question_id] !== undefined) {
                    ctx[q.data_key] = answers[q.question_id];
                }
            });
            return ctx;
        }

        function actualizarVisibilidad() {
            const ctx = contextoCondiciones();
            montadas.forEach(({ card, q }) => {
                const visible = window.Condiciones
                    ? Condiciones.debeMostrarse(q.show_if, ctx)
                    : true;
                card.hidden = !visible;
            });
        }

        function estaVisible(questionId) {
            const m = montadas.find(x => x.q.question_id === questionId);
            return m ? !m.card.hidden : true;
        }

        // --- Interacción ----------------------------------------------------

        function saveAnswer(q, value) {
            const id = q.question_id !== undefined ? q.question_id : q;
            answers[id] = value;
            actualizarVisibilidad();
        }

        // --- Submission Logic ---

        async function submitForm() {
            if (!currentSubmissionId) return;

            // Sólo viaja lo que está a la vista. Si alguien contestó una
            // pregunta y después cambió la disparadora que la ocultaba, esa
            // respuesta ya no corresponde y no debe puntuar.
            const payload = {
                answers: Object.entries(answers)
                    .filter(([qid]) => estaVisible(qid))
                    .map(([qid, val]) => ({ question_id: qid, value: val }))
            };

            const faltan = montadas.filter(({ card, q }) =>
                !card.hidden && q.is_required && answers[q.question_id] === undefined
            );
            if (faltan.length > 0) {
                alert('Faltan respuestas obligatorias: ' +
                      faltan.map(({ q }) => t(q.text_key) || q.variable_name).join(', '));
                faltan[0].card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            if (payload.answers.length === 0) {
                alert("Por favor contesta al menos una pregunta.");
                return;
            }

            // Show loading state
            const submitBtn = document.querySelector('button[onclick="submitForm()"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Procesando...";
            submitBtn.disabled = true;

            try {
                // 2. Send Answers (Partial Save)
                console.log("Sending answers...", payload);
                await api.request(`/clinical/submissions/${currentSubmissionId}/answers`, 'PUT', payload);

                // 3. Finalize (Trigger Scoring)
                console.log("Finalizing...");
                const result = await api.finalizeSubmission(currentSubmissionId);

                // 4. Handle Result (Score/Alerts)
                console.log("Submission Result:", result);

                let msg = 'Evaluación completada.';
                if (result.total_score !== undefined && result.total_score !== null) {
                    msg += `\n\nPuntuación Total: ${result.total_score}`;
                }

                if (result.calculated_values && result.calculated_values.iciq_total) {
                    // Specific feedback if needed
                }

                alert(msg);
                window.location.href = 'progress.html'; // Or dashboard

            } catch (error) {
                console.error('Error submitting form:', error);
                alert('Error al enviar la evaluación: ' + error.message);
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        loadForm();
    </script>
</body>

</html>
