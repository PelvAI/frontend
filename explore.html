<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vela - Explorar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .filter-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-chip.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container" style="padding-bottom: 100px;">
        <div class="mb-4">
            <h2 data-i18n="explore.title">Explorar</h2>
        </div>

        <input type="text" placeholder="Buscar ejercicios, temas..." id="searchInput" class="mb-4"
            data-i18n="explore.search_placeholder">

        <!-- Category Filters -->
        <div class="filter-scroll" id="categoryFilters">
            <button class="filter-chip active" data-filter="all">Todos</button>
            <button class="filter-chip" data-filter="Fortalecer">Fortalecer</button>
            <button class="filter-chip" data-filter="Relajar">Relajar</button>
            <button class="filter-chip" data-filter="Coordinar">Coordinar</button>
            <button class="filter-chip" data-filter="Salud">Salud</button>
        </div>

        <div class="mb-4">
            <h3 data-i18n="explore.my_program">Mi Programa</h3>
            <div id="programCard" class="card clickable">
                <p class="text-center text-small">Cargando tu plan...</p>
            </div>
        </div>

        <div class="mb-4">
            <h3 data-i18n="explore.library">Biblioteca de Ejercicios</h3>
            <div id="exercisesList">
                <p class="text-center text-small">Cargando ejercicios...</p>
            </div>
        </div>

        <div class="mb-4">
            <h3 data-i18n="explore.education">Aprende</h3>
            <div id="educationList" class="flex-grid" style="grid-template-columns: repeat(2, 1fr);">
                <p class="text-center text-small">Cargando contenido...</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h3 id="modalTitle" class="mb-2">Título</h3>
            <div id="modalBody">
                <!-- Content injected here -->
            </div>
            <button class="btn-primary mt-4" onclick="closeModal()" style="width: 100%;">Cerrar</button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
        <button class="tab-btn" onclick="window.location.href='dashboard.html'">
            <span class="tab-icon">🏠</span>
            <span class="text-small" data-i18n="menu.home">Inicio</span>
        </button>
        <button class="tab-btn" onclick="window.location.href='progress.html'">
            <span class="tab-icon">📊</span>
            <span class="text-small" data-i18n="menu.progress">Progreso</span>
        </button>
        <button class="tab-btn active" onclick="window.location.href='explore.html'">
            <span class="tab-icon">📚</span>
            <span class="text-small" data-i18n="menu.explore">Explorar</span>
        </button>
        <button class="tab-btn" onclick="window.location.href='profile.html'">
            <span class="tab-icon">👤</span>
            <span class="text-small" data-i18n="menu.profile">Perfil</span>
        </button>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/api.js"></script>
    <script>
        let allExercises = [];
        let allEducation = [];
        let activeFilter = 'all';

        async function loadExplore() {
            // Initialize global settings
            api.initApp();

            try {
                // 1. Load My Program (Dynamic)
                try {
                    const plan = await api.getDailyPlan();
                    const programCard = document.getElementById('programCard');

                    if (plan) {
                        const templateName = plan.template ? plan.template.name : 'Personalizado';
                        const status = plan.status === 'completed' ? '✅ Completado' : '📅 Pendiente para hoy';

                        programCard.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h4 style="margin: 0;">${templateName}</h4>
                                    <p class="text-small" style="margin-top: 4px;">${status}</p>
                                </div>
                                <div style="font-size: 24px;">💪</div>
                            </div>
                        `;
                        programCard.onclick = () => window.location.href = 'dashboard.html'; // Go to dashboard to start
                    }
                } catch (e) {
                    console.warn('No active plan found', e);
                    document.getElementById('programCard').innerHTML = `
                        <p>No tienes un plan activo hoy.</p>
                        <p class="text-small">Explora ejercicios abajo.</p>
                    `;
                }

                // 2. Load Exercises
                allExercises = await api.getExercises();
                renderExercises();

                // 3. Load Education
                allEducation = await api.getEducation();
                renderEducation();

            } catch (error) {
                console.error('Error loading explore:', error);
            }
        }

        function renderExercises() {
            const container = document.getElementById('exercisesList');
            container.innerHTML = '';

            const filtered = allExercises.filter(ex => {
                const cat = (ex.meta_data?.category || '').toLowerCase();
                return activeFilter === 'all' || cat.includes(activeFilter.toLowerCase());
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-small text-center">No se encontraron ejercicios.</p>';
                return;
            }

            filtered.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'card clickable';
                card.style.display = 'flex';
                card.style.justifyContent = 'space-between';
                card.style.alignItems = 'center';
                card.style.marginBottom = '12px';

                const meta = ex.meta_data || {};
                const duration = meta.duration ? `${meta.duration} min` : '';
                const category = meta.category || 'General';
                const name = meta.name || 'Ejercicio';

                card.innerHTML = `
                    <div>
                        <p style="font-weight: 600;">${name}</p>
                        <span class="text-small" style="color: #666;">${category} • ${duration}</span>
                    </div>
                    <div style="font-size: 24px; color: var(--primary-color);">▶</div>
                `;
                card.onclick = () => openModal(name, `
                    <p><strong>Categoría:</strong> ${category}</p>
                    <p><strong>Duración:</strong> ${duration}</p>
                    <div style="background: #eee; height: 150px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin: 16px 0;">
                        <span style="color: #666;">Video Placeholder: ${ex.video_path}</span>
                    </div>
                    <p>Aquí irían las instrucciones detalladas del ejercicio.</p>
                `);
                container.appendChild(card);
            });
        }

        function renderEducation() {
            const container = document.getElementById('educationList');
            container.innerHTML = '';

            const filtered = allEducation.filter(mod => {
                const cat = (mod.category || '').toLowerCase();
                return activeFilter === 'all' || cat.includes(activeFilter.toLowerCase());
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-small text-center" style="grid-column: 1/-1;">No hay contenido educativo.</p>';
                return;
            }

            filtered.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'card clickable text-center';

                let emoji = '📄';
                if (mod.type === 'video') emoji = '🎥';
                if (mod.type === 'tip') emoji = '💡';

                card.innerHTML = `
                    <div style="font-size: 32px; margin-bottom: 8px;">${emoji}</div>
                    <p style="font-size: 14px; line-height: 1.3;">${mod.title}</p>
                    <p class="text-small" style="margin-top: 4px; color: #888;">${mod.category || 'General'}</p>
                `;
                card.onclick = () => openModal(mod.title, `
                    <div style="text-align: left;">
                        <span class="tag" style="background: #eee; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${mod.category || 'General'}</span>
                        <p class="mt-4" style="line-height: 1.6;">${mod.content}</p>
                    </div>
                `);
                container.appendChild(card);
            });
        }

        // Filter Logic
        document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all
                document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                // Add to clicked
                e.target.classList.add('active');
                activeFilter = e.target.dataset.filter;

                renderExercises();
                renderEducation();
            });
        });

        // Search Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();

            document.querySelectorAll('#exercisesList .card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });

            document.querySelectorAll('#educationList .card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        });

        // Modal Logic
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function openModal(title, content) {
            modalTitle.textContent = title;
            modalBody.innerHTML = content;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Close on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        loadExplore();
    </script>
</body>

</html>
